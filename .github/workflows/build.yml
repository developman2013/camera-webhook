name: Build

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore CameraWebhook.sln
      - run: dotnet build CameraWebhook.sln --configuration Release --no-restore
      - run: dotnet test tests/CameraWebhook.Tests/CameraWebhook.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: tests/CameraWebhook.Tests/TestResults/*.trx

